<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nexus App</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #06101f;
      color: #f4f7fb;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }
    main {
      position: relative;
      height: 100%;
      animation: card-in 620ms cubic-bezier(.16, .84, .24, 1) both;
    }
    .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 54px 64px 32px;
      background: linear-gradient(to top, rgba(4, 10, 22, 0.94) 0%, rgba(4, 10, 22, 0.55) 58%, rgba(4, 10, 22, 0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .track {
      width: min(560px, 82%);
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .bar {
      width: 6%;
      height: 100%;
      border-radius: inherit;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.85);
      transition: width 280ms ease-out;
    }
    p {
      margin: 0;
      min-height: 18px;
      color: #e7eef8;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-align: center;
    }
    @keyframes card-in {
      from { opacity: 0; transform: scale(0.965); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="art" src="splash-brand.jpg" alt="Nexus App. Proposal Builder" />
    <footer>
      <div class="track" aria-hidden="true"><div id="bar" class="bar"></div></div>
      <p id="label">Starting the proposal engine</p>
    </footer>
  </main>
  <script>
    function visibleLabel(label) {
      return String(label || '')
        .replace(/local team pin\s*\d*/gi, '')
        .replace(/\bpin\s*\d+/gi, '')
        .replace(/\s{2,}/g, ' ')
        .replace(/\s+\./g, '.')
        .trim();
    }
    window.setSplash = function (percent, label) {
      const bar = document.getElementById('bar');
      const text = document.getElementById('label');
      const next = Math.max(0, Math.min(100, Number(percent) || 0));
      bar.style.width = next + '%';
      const clean = visibleLabel(label);
      if (clean) text.textContent = clean;
    };
  </script>
</body>
</html>
