databases:
  - name: weott-nexus-workspace
    plan: basic-256mb
    databaseName: weott_nexus
    user: weott

services:
  - type: web
    name: weott-quote-builder
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/workspace-suite run build && test "$(stat -c%s installer/WEOTT-Quote-Builder-Setup.exe)" -gt 1000000 && cp installer/WEOTT-Quote-Builder-Setup.exe artifacts/workspace-suite/dist/public/WEOTT-Quote-Builder-Setup.exe
    staticPublishPath: artifacts/workspace-suite/dist/public
    routes:
      - type: rewrite
        source: /setup-download
        destination: /pages/download.html
      - type: rewrite
        source: /setup
        destination: /pages/manual.html
      - type: rewrite
        source: /manual
        destination: /pages/manual.html
      - type: rewrite
        source: /health
        destination: /pages/health.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /WEOTT-Quote-Builder-Setup.exe
        name: Content-Disposition
        value: attachment; filename="WEOTT-Quote-Builder-Setup.exe"

  - type: web
    name: weott-proposal-engine
    runtime: python
    rootDir: artifacts/pdf-engine
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 60 --preload
    envVars:
      - key: NEXUS_TEAM_PASSWORD
        sync: false
      - key: NEXUS_AUTH_SECRET
        generateValue: true
      - key: NEXUS_ADMIN_TOKEN
        sync: false
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: weott-nexus-workspace
          property: connectionString
