services:
  - type: web
    name: weott-quote-builder
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/workspace-suite run build
    staticPublishPath: artifacts/workspace-suite/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: weott-proposal-engine
    runtime: python
    rootDir: artifacts/pdf-engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: NEXUS_TEAM_PASSWORD
        value: "945762"
      - key: NEXUS_AUTH_SECRET
        generateValue: true
